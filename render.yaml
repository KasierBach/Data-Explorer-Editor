services:
  - type: web
    name: data-explorer-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'npx prisma migrate deploy && exec node dist/src/main.js'
    autoDeployTrigger: "off"
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://data-explorer-editor.vercel.app
      - key: ALLOW_INTERNAL_IPS
        value: false
      - key: ALLOW_INSECURE_DATABASE_TLS
        value: false
      - key: AI_PROVIDER_TIMEOUT_MS
        value: 90000
      - key: AI_STREAM_IDLE_TIMEOUT_MS
        value: 90000
