# Local-by-default Docker Compose baseline.
# All published ports bind to localhost unless overridden via env vars.

services:
  db:
    image: postgres:15-alpine
    container_name: data-explorer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: data_explorer
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: data-explorer-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: data-explorer-migrate
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-change-me-local}@db:5432/data_explorer
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: data-explorer-backend
    ports:
      - "${BACKEND_BIND:-127.0.0.1:3001}:3001"
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-change-me-local}@db:5432/data_explorer
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost
      - API_PUBLIC_URL=http://localhost:3001/api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001/api
    container_name: data-explorer-frontend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: data-explorer-network
