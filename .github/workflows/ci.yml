name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-checks-build:
    name: Client checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: node ../.github/scripts/npm-audit.mjs
        env:
          # SPA-only usage; allow the React Router RSC advisory while keeping all other high/critical findings blocking.
          NPM_AUDIT_ALLOW_GHSA: GHSA-QWWW-VCR4-C8H2
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run test:prerender
      - run: node --test ../.github/scripts/deploy-render.test.mjs ../.github/scripts/deployment-config.test.mjs ../.github/scripts/npm-audit.test.mjs ../.github/scripts/browser-ci-artifacts.test.mjs
      - name: Build the browser-test variant once
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001/api
      - name: Freeze complete browser inventory and seal the build
        shell: bash
        env:
          VITE_API_URL: http://localhost:3001/api
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/browser-build"
          mkdir "$out"
          PLAYWRIGHT_JSON_OUTPUT_FILE="$out/inventory.json" npx --no-install playwright test --list --reporter=json
          for shard in 1 2 3 4; do
            PLAYWRIGHT_JSON_OUTPUT_FILE="$out/inventory-$shard.json" npx --no-install playwright test --list --shard="$shard/4" --workers=1 --reporter=json
          done
          node ../.github/scripts/browser-ci-artifacts.mjs seal-build "$out"
      - name: Upload the sealed browser build
        uses: actions/upload-artifact@v6
        with:
          name: browser-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-unit-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: client/coverage/
          if-no-files-found: error
          retention-days: 7

  client-browser:
    name: Client browser shard ${{ matrix.shardIndex }}/4
    needs: client-checks-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shardIndex: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Download the same-run sealed build
        uses: actions/download-artifact@v6
        with:
          name: browser-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-build
      - name: Verify and install the browser build
        run: node ../.github/scripts/browser-ci-artifacts.mjs install-build "$RUNNER_TEMP/browser-build"
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run one complete browser shard
        id: browser-tests
        shell: bash
        env:
          BROWSER_BUILD_ARTIFACT: ${{ runner.temp }}/browser-build
        run: |
          set -euo pipefail
          npx --no-install playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shardIndex }}/4 --workers=1
      - name: Verify post-test build and record shard evidence
        if: always() && steps.browser-tests.outcome != 'skipped'
        env:
          BROWSER_TEST_OUTCOME: ${{ steps.browser-tests.outcome }}
        run: node ../.github/scripts/browser-ci-artifacts.mjs record-shard ci-results "$RUNNER_TEMP/browser-build" ${{ matrix.shardIndex }}
      - name: Upload this shard's reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-shard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shardIndex }}
          path: |
            client/ci-results/
            client/test-results/
          if-no-files-found: error
          retention-days: 7

  client:
    name: Client
    needs: [client-checks-build, client-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Download the sealed inventory
        uses: actions/download-artifact@v6
        with:
          name: browser-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-build
      - name: Download shard reports without flattening their identities
        uses: actions/download-artifact@v6
        with:
          pattern: browser-shard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/browser-shards
      - name: Validate blob sources for the merged report
        run: node ../.github/scripts/browser-ci-artifacts.mjs prepare-reports "$RUNNER_TEMP/browser-shards"
      - name: Merge browser reports for diagnostics
        run: npx --no-install playwright merge-reports --config=playwright.merge.config.ts all-blob-reports
      - name: Require successful producers and exact complete inventory
        if: always()
        env:
          CLIENT_BUILD_RESULT: ${{ needs.client-checks-build.result }}
          CLIENT_SHARDS_RESULT: ${{ needs.client-browser.result }}
        run: node ../.github/scripts/browser-ci-artifacts.mjs verify-gate "$RUNNER_TEMP/browser-build" "$RUNNER_TEMP/browser-shards" ci-results/merged-results.json
      - name: Upload merged browser verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            client/playwright-report/
            client/ci-results/
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:15432/data_explorer_e2e
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:15432/data_explorer_e2e
      E2E_REDIS_URL: redis://127.0.0.1:16379/15
      COMPOSE_PROJECT_NAME: data-explorer-server-${{ github.run_id }}
      AI_EVAL_RUNNER_CONTAINER: ai-eval-ci-${{ github.run_id }}-${{ github.run_attempt }}-eval-runner-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node ../.github/scripts/npm-audit.mjs
        env:
          # Prisma 6.19.3 still resolves deepmerge-ts 7.x; npm's only fix is a Prisma 6.12 downgrade.
          # Keep this known transitive CLI/config advisory explicit while retaining all other blockers.
          NPM_AUDIT_ALLOW_GHSA: GHSA-GGR8-5VV4-36MX
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: node --test scripts/prisma-generate-safe.test.mjs test/ai-execution-ledger-worker.test.cjs scripts/ai-eval/native-replay.test.mjs scripts/ai-eval/model-role-assessment.test.mjs scripts/ai-eval/model-native-worker.test.mjs test/ai-model-role-adapter.test.cjs test/ai-model-role-live.test.cjs test/ai-model-role-runner.test.cjs test/ai-provider-model-catalog.test.cjs test/ai-provider-model-live-runner.test.cjs ../.github/scripts/browser-ci-workflow.test.mjs
      - name: Start owned PostgreSQL, Redis, MongoDB and MySQL fixtures
        run: docker compose -f test/compose.e2e.yml -f test/compose.r03.yml up -d --wait
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build
      - name: Start network-isolated native evaluation fixtures
        id: native-eval-fixtures
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          project="ai-eval-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -z "$(docker ps -a --filter "label=com.docker.compose.project=$project" --format '{{.ID}}')"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
          docker compose --project-name "$project" -f test/compose.ai-eval.yml up --detach --wait --wait-timeout 150
      - name: Run server E2E checks with failure-preserving logs
        timeout-minutes: 10
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm run test:e2e -- --detectOpenHandles --json --outputFile=e2e-results.json 2>&1 | tee e2e.log
      - name: Capture fixture logs
        if: always()
        run: docker compose -f test/compose.e2e.yml -f test/compose.r03.yml logs --no-color > fixture.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: server-verification-${{ github.sha }}
          path: |
            server/coverage/
            server/e2e-results.json
            server/e2e.log
            server/fixture.log
            ${{ runner.temp }}/ai-eval-ci-${{ github.run_id }}-${{ github.run_attempt }}-native-results.json
      - name: Remove owned fixtures
        if: always()
        run: docker compose -f test/compose.e2e.yml -f test/compose.r03.yml down --volumes --remove-orphans
      - name: Remove native evaluation fixtures
        if: always() && steps.native-eval-fixtures.outputs.owned == 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          project="ai-eval-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose --project-name "$project" -f test/compose.ai-eval.yml down --volumes --remove-orphans

  full-stack:
    name: Full-stack browser
    needs: [client, server]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:15432/data_explorer_e2e
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:15432/data_explorer_e2e
      E2E_REDIS_URL: redis://127.0.0.1:16379/15
      COMPOSE_PROJECT_NAME: data-explorer-browser-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: server
      - run: npm run typecheck:browser
        working-directory: client
      - name: Start owned PostgreSQL and Redis fixtures
        run: docker compose -f server/test/compose.e2e.yml up -d --wait
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Run full-stack browser checks with failure-preserving logs
        shell: bash
        run: |
          set -euo pipefail
          npm run test:full-stack 2>&1 | tee full-stack.log
        working-directory: client
      - name: Capture fixture logs
        if: always()
        run: docker compose -f server/test/compose.e2e.yml logs --no-color > fixture-browser.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-stack-verification-${{ github.sha }}
          path: |
            client/playwright-full-stack-report/
            client/test-results-full-stack/
            client/full-stack.log
            fixture-browser.log
      - name: Remove owned fixtures
        if: always()
        run: docker compose -f server/test/compose.e2e.yml down --volumes --remove-orphans

  containers:
    name: Container images
    needs: [client, server, full-stack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://data-explorer-editor-9v55.onrender.com' }}
        run: |
          image_prefix="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          api_url="${PRODUCTION_API_URL%/}/api"
          docker build --build-arg "VITE_API_URL=$api_url" --tag "$image_prefix/client:${GITHUB_SHA}" --tag "$image_prefix/client:main" client
          docker build --tag "$image_prefix/server:${GITHUB_SHA}" --tag "$image_prefix/server:main" server
          echo "IMAGE_PREFIX=$image_prefix" >> "$GITHUB_ENV"
      - name: Scan images for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/server:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan client image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/client:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Install pinned Syft
        timeout-minutes: 12
        env:
          SYFT_VERSION: 1.51.1
          SYFT_SHA256: 8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/syft-$SYFT_VERSION"
          archive_name="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          archive="$work_dir/$archive_name"
          bin_dir="$work_dir/bin"
          url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive_name}"

          rm -rf "$work_dir"
          mkdir -p "$bin_dir"
          curl --fail --location --show-error \
            --connect-timeout 15 --max-time 180 \
            --retry 5 --retry-delay 5 --retry-max-time 600 --retry-all-errors \
            "$url" --output "$archive"
          (
            cd "$work_dir"
            printf '%s  %s\n' "$SYFT_SHA256" "$archive_name" | sha256sum --check --strict
          )
          tar -xzf "$archive" -C "$bin_dir" syft
          chmod +x "$bin_dir/syft"
          "$bin_dir/syft" version
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Generate SBOM files
        timeout-minutes: 12
        run: |
          set -euo pipefail
          syft scan "$IMAGE_PREFIX/server:${GITHUB_SHA}" --output "spdx-json=sbom-server-${GITHUB_SHA}.spdx.json"
          syft scan "$IMAGE_PREFIX/client:${GITHUB_SHA}" --output "spdx-json=sbom-client-${GITHUB_SHA}.spdx.json"
          test -s "sbom-server-${GITHUB_SHA}.spdx.json"
          test -s "sbom-client-${GITHUB_SHA}.spdx.json"
      - name: Upload server SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom-server-${{ github.sha }}.spdx.json
          path: sbom-server-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload client SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom-client-${{ github.sha }}.spdx.json
          path: sbom-client-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish images
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX/client:${GITHUB_SHA}"
          docker push "$IMAGE_PREFIX/client:main"
          docker push "$IMAGE_PREFIX/server:${GITHUB_SHA}"
          docker push "$IMAGE_PREFIX/server:main"
