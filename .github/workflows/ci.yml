name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: node ../.github/scripts/npm-audit.mjs
        env:
          # SPA-only usage; allow the React Router RSC advisory while keeping all other high/critical findings blocking.
          NPM_AUDIT_ALLOW_GHSA: GHSA-QWWW-VCR4-C8H2
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run test:prerender
      - run: node --test ../.github/scripts/deploy-render.test.mjs ../.github/scripts/npm-audit.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node ../.github/scripts/npm-audit.mjs
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  containers:
    name: Container images
    needs: [client, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          image_prefix="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          docker build --tag "$image_prefix/client:${GITHUB_SHA}" --tag "$image_prefix/client:main" client
          docker build --tag "$image_prefix/server:${GITHUB_SHA}" --tag "$image_prefix/server:main" server
          echo "IMAGE_PREFIX=$image_prefix" >> "$GITHUB_ENV"
      - name: Publish images
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX/client:${GITHUB_SHA}"
          docker push "$IMAGE_PREFIX/client:main"
          docker push "$IMAGE_PREFIX/server:${GITHUB_SHA}"
          docker push "$IMAGE_PREFIX/server:main"
