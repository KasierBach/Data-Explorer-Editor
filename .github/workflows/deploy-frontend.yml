name: Deploy production frontend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy-vercel:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: client
    env:
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://data-explorer-editor-9v55.onrender.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Validate deployment policy
        working-directory: .
        run: node --test .github/scripts/deployment-policy.test.mjs
      - name: Decide whether production needs this verified source
        id: deployment-policy
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://data-explorer-editor-9v55.onrender.com' }}
          FORCE_DEPLOY: ${{ vars.FORCE_FRONTEND_DEPLOY }}
        run: node .github/scripts/deployment-policy.mjs decide frontend "$RUNNER_TEMP/deployment-policy"
      - name: Publish the deployment decision
        uses: actions/upload-artifact@v6
        with:
          name: deployment-decision-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-policy/decision.json
          if-no-files-found: error
          retention-days: 90
      - name: Validate Vercel configuration
        if: steps.deployment-policy.outputs.decision == 'deploy'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { printf '%s\n' 'VERCEL_TOKEN is not configured in the production environment'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { printf '%s\n' 'VERCEL_ORG_ID is not configured in the production environment'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { printf '%s\n' 'VERCEL_PROJECT_ID is not configured in the production environment'; exit 1; }
      - run: npm ci
        if: steps.deployment-policy.outputs.decision == 'deploy'
      - name: Link Vercel project
        if: steps.deployment-policy.outputs.decision == 'deploy'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@59.6.2 link --yes --project="$VERCEL_PROJECT_ID" --team="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Pull Vercel production settings
        if: steps.deployment-policy.outputs.decision == 'deploy'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@59.6.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build verified production frontend
        if: steps.deployment-policy.outputs.decision == 'deploy'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          api_url="${PRODUCTION_API_URL%/}/api"
          VITE_API_URL="$api_url" npx vercel@59.6.2 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified build to production
        id: actual-deployment
        if: steps.deployment-policy.outputs.decision == 'deploy'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(npx vercel@59.6.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          printf '%s\n' "$deployment_url" > "$RUNNER_TEMP/deployment-policy/deployment-url.txt"
          printf 'Production frontend: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Record actual successful frontend deployment
        id: deployment-receipt
        if: steps.deployment-policy.outputs.decision == 'deploy' && steps.actual-deployment.outcome == 'success'
        working-directory: .
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://data-explorer-editor-9v55.onrender.com' }}
          DEPLOYMENT_URL_FILE: ${{ runner.temp }}/deployment-policy/deployment-url.txt
        run: node .github/scripts/deployment-policy.mjs record frontend "$RUNNER_TEMP/deployment-policy"
      - name: Publish actual successful frontend receipt
        if: steps.deployment-policy.outputs.decision == 'deploy' && steps.actual-deployment.outcome == 'success' && steps.deployment-receipt.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: actual-deployment-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-policy/receipt.json
          if-no-files-found: error
          retention-days: 90
