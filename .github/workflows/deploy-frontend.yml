name: Deploy production frontend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy-vercel:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: client
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://data-explorer-editor-9v55.onrender.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Validate Vercel configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured in the production environment"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is not configured in the production environment"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is not configured in the production environment"; exit 1; }
      - run: npm ci
      - name: Link Vercel project
        run: npx vercel@59.6.2 link --yes --project="$VERCEL_PROJECT_ID" --team="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Pull Vercel production settings
        run: npx vercel@59.6.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build verified production frontend
        run: |
          api_url="${PRODUCTION_API_URL%/}/api"
          VITE_API_URL="$api_url" npx vercel@59.6.2 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified build to production
        run: |
          deployment_url="$(npx vercel@59.6.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Production frontend: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
