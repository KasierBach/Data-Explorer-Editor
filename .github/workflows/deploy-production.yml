name: Deploy production backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy-render:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate deploy automation
        run: node --test .github/scripts/deploy-render.test.mjs
      - name: Deploy exact commit and verify readiness
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/deploy-render.mjs
