# ──────────────────────────────────────────────
# Data Explorer – Nginx Configuration
# SPA routing, gzip, security headers, caching
# ──────────────────────────────────────────────

# Header values are mapped at server scope so location headers do not drop CSP.
map "$status:$request_uri" $public_robots {
    default "";
    ~^404: "noindex, follow";
    ~^\d+:/((login|forgot-password|legal-consent|onboarding)([/?]|$)|(sql-explorer|nosql-explorer|admin|teams|billing)([/?]|$)) "noindex, nofollow";
}

map $uri $asset_cache {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── Gzip Compression ─────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # ── Security Headers ─────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:3001 https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    add_header X-Robots-Tag $public_robots always;
    add_header Cache-Control $asset_cache always;

    # ── Static Asset Caching ─────────────────
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # ── Public HTML and canonical URLs ──────
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/(en|docs|changelog|legal|privacy|terms)(?:/.*)?\.html$ {
        rewrite ^/(.*)\.html$ /$1 permanent;
    }

    location ~ ^/(en|docs|changelog|legal|privacy|terms)(?:/.*)?/$ {
        rewrite ^/(.*)/$ /$1 permanent;
    }

    # ── Known application routes only ───────
    location ~ ^/(?:login|forgot-password|legal-consent|onboarding|(?:sql-explorer|nosql-explorer|admin|teams|billing)(?:/.*)?)$ {
        try_files /app.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Disable logging for health checks ────
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # ── Disable access to hidden files ───────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
