services:
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:17017:27017'
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    command: ['--log-bin-trust-function-creators=1']
    environment:
      MYSQL_ROOT_PASSWORD: r03-root-local-only
      MYSQL_DATABASE: data_explorer_r03
      MYSQL_USER: e2e
      MYSQL_PASSWORD: r03-local-only
    ports:
      - '127.0.0.1:13306:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysql',
          '--protocol=TCP',
          '-h',
          '127.0.0.1',
          '-ue2e',
          '-pr03-local-only',
          '-e',
          'SELECT 1',
          'data_explorer_r03',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
